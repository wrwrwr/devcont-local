name: Check code

on:
  pull_request:
  push:
    branches: [main]
    tags-ignore: ['[0-9]+.*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install npm tools
        run: npm install

      - name: Add tools to path
        run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache tool results
        uses: actions/cache@v6
        with:
          path: .cache
          key: results-${{ hashFiles('package.json', 'prek.toml') }}

      - name: Run lints and tests
        uses: j178/prek-action@v3.1.0
